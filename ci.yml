name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests app.py

      - name: Format check
        run: ruff format --check src tests app.py

      - name: Type check
        run: mypy

      - name: Tool docs are up to date
        run: python scripts/generate_tool_docs.py --check

      - name: Test
        run: pytest -m "not network" -q

  build:
    name: Build and smoke-test package
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Install wheel in a clean venv and run the console script
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          QUANT_MCP_TRANSPORT=http QUANT_MCP_PORT=8765 \
            /tmp/venv/bin/quant-mcp &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/healthz | grep -q '"ok"'

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: quant-mcp:ci
      - name: Run container and check health
        run: |
          docker run -d --name qm -p 8000:8000 quant-mcp:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz | grep -q '"ok"'
          docker rm -f qm
